name: NIDAN AI CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-checks:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: nidan_user
          POSTGRES_PASSWORD: nidan_password
          POSTGRES_DB: nidan_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx flake8 black isort

      - name: Run Python Linters
        run: |
          flake8 backend --count --select=E9,F63,F7,F82 --show-source --statistics
          black --check backend tests

      - name: Run Backend Tests
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://nidan_user:nidan_password@localhost:5432/nidan_ai_test
          REDIS_URL: redis://localhost:6379/0
          SECRET_KEY: test_secret_key_medical_compliance_32char
          STORAGE_BACKEND: local
          STORAGE_LOCAL_ROOT: ./test_storage
        run: |
          pytest tests/backend -v

  frontend-checks:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Run Frontend Lint & Typecheck
        working-directory: ./frontend
        run: |
          npm run lint
          npm run typecheck

      - name: Test Frontend Build
        working-directory: ./frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
