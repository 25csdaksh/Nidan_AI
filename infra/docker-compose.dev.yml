version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: nidan_postgres_dev
    environment:
      POSTGRES_USER: nidan_user
      POSTGRES_PASSWORD: nidan_dev_password
      POSTGRES_DB: nidan_ai_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: nidan_redis_dev
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: nidan_backend_dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ../backend:/app
      - dev_storage:/app/storage
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://nidan_user:nidan_dev_password@postgres:5432/nidan_ai_dev
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev_secret_key_medical_compliance_32char
      DEBUG: "true"
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /app/storage
    depends_on:
      - postgres
      - redis

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: nidan_frontend_dev
    command: ["npm", "run", "dev"]
    volumes:
      - ../frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata_dev:
  dev_storage:
